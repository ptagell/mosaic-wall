services:
  mosaic-wall:
    build: .
    image: mosaic-wall:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - IMMICH_URL=${IMMICH_URL:-http://localhost:2283}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - PERSON_IDS=${PERSON_IDS}
      - PORT=4000
      - DATA_DIR=/app/data
      - TZ=${TZ:-UTC}
    volumes:
      - ./data:/app/data
